<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="55%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="floodlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF6D8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF6D8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a6d1f"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8a6d1f"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="900" height="320" fill="url(#bg)"/>

  <!-- pitch lines -->
  <g stroke="#2a2a2a" stroke-width="1.5" opacity="0.5">
    <line x1="0" y1="300" x2="900" y2="300"/>
    <circle cx="450" cy="300" r="60" fill="none"/>
    <line x1="450" y1="240" x2="450" y2="320"/>
  </g>

  <!-- floodlights, pulsing -->
  <circle cx="90" cy="40" r="90" fill="url(#floodlight)">
    <animate attributeName="opacity" values="0.25;0.7;0.25" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="810" cy="40" r="90" fill="url(#floodlight)">
    <animate attributeName="opacity" values="0.7;0.25;0.7" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- speed trail lines sweeping across -->
  <g stroke="url(#gold)" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="-200" y1="120" x2="-40" y2="120">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1150 0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="-260" y1="150" x2="-60" y2="150" stroke-width="2" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1150 0" dur="1.6s" begin="0.2s" repeatCount="indefinite"/>
    </line>
    <line x1="-320" y1="180" x2="-90" y2="180" stroke-width="1.5" opacity="0.35">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1150 0" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- athlete silhouette performing an overhead (bicycle-kick) motion -->
  <g id="athlete" transform="translate(450,190)">
    <g id="rotor">
      <!-- torso -->
      <ellipse cx="0" cy="0" rx="14" ry="26" fill="#0d0d0d" stroke="#D4AF37" stroke-width="1.5"/>
      <!-- head -->
      <circle cx="0" cy="-34" r="10" fill="#0d0d0d" stroke="#D4AF37" stroke-width="1.5"/>
      <!-- kicking leg -->
      <path d="M 6 20 Q 40 -10 20 -55" stroke="#0d0d0d" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M 6 20 Q 40 -10 20 -55" stroke="#D4AF37" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
      <!-- planted leg -->
      <path d="M -4 22 Q -20 40 -10 60" stroke="#0d0d0d" stroke-width="10" fill="none" stroke-linecap="round"/>
      <!-- arms -->
      <path d="M -10 -12 Q -30 -6 -34 12" stroke="#0d0d0d" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M 10 -12 Q 26 4 18 22" stroke="#0d0d0d" stroke-width="7" fill="none" stroke-linecap="round"/>

      <animateTransform attributeName="transform" type="rotate"
        values="0;-25;-95;-160;-200;-160;-95;-25;0"
        keyTimes="0;0.12;0.3;0.45;0.5;0.55;0.7;0.88;1"
        dur="2.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ball, kicked on impact -->
  <circle r="7" fill="#e7e7e7" stroke="#D4AF37" stroke-width="1">
    <animateMotion dur="2.6s" repeatCount="indefinite"
      path="M 470,150 C 520,90 560,40 640,20"
      keyPoints="0;0;0;0.02;0.05;0.15;0.3;1;1"
      keyTimes="0;0.35;0.48;0.5;0.55;0.65;0.8;0.95;1"
      calcMode="linear"/>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.48;0.5;0.9;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- impact flash -->
  <circle cx="470" cy="150" r="4" fill="#D4AF37">
    <animate attributeName="r" values="2;40;2" keyTimes="0;0.5;1" dur="0.4s" begin="1.3s;3.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0" keyTimes="0;0.5;1" dur="0.4s" begin="1.3s;3.9s" repeatCount="indefinite"/>
  </circle>

  <!-- match clock -->
  <g font-family="Courier New, monospace" fill="#D4AF37">
    <text x="30" y="290" font-size="20" letter-spacing="2">88:00</text>
    <text x="770" y="290" font-size="14" letter-spacing="1" fill="#8a8a8a">ELITE MODE</text>
  </g>
</svg>
